<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>esvigy</title>
<link rel="icon" href="static/icon.svg">
<link rel="stylesheet" href="static/style.css">
</head>
<body data-bg="white">
<aside id="side">
  <div class="side-head">
    <span class="logo">esvigy</span>
    <button id="refresh" title="Reload folder (r)">⟳</button>
  </div>
  <input id="filter" type="search" placeholder="Filter files…  ( / )" autocomplete="off">
  <nav id="tree"></nav>
</aside>

<main id="main">
  <div class="bar">
    <button id="toggle-side" title="Toggle sidebar (s)">☰</button>
    <button id="open" title="Open folder… (o)">Open…</button>
    <div id="crumbs"></div>
    <span id="status"></span>
    <span class="grow"></span>
    <button id="g-cmp" title="Compare the two selected files (c)" hidden>Compare 2</button>
    <button id="view" title="Grid / table view (t)">☷</button>
    <select id="sort" title="Sort">
      <option value="name">Name</option>
      <option value="size">Size</option>
      <option value="mtime">Modified</option>
    </select>
    <button id="bg" title="Background (b)">◐</button>
    <input id="tile" type="range" min="96" max="420" step="4" value="180" title="Thumbnail size">
  </div>
  <div id="thead" hidden>
    <span></span>
    <button data-sort="name">Name</button>
    <span>Dimensions</span>
    <button data-sort="size">File size</button>
    <button data-sort="mtime">Modified</button>
  </div>
  <div id="grid"></div>
  <div id="empty" hidden>No SVG files in this folder.</div>

  <section id="viewer" hidden>
    <div class="bar">
      <button id="v-close" title="Back to grid (Esc)">←</button>
      <span id="v-name"></span>
      <span id="v-info"></span>
      <span class="grow"></span>
      <span id="v-time"></span>
      <button id="v-cmp" title="Compare with another file (c)">Compare</button>
      <button id="v-layout" title="Side by side / stacked (l)">◫</button>
      <button id="v-link" title="Link pan and zoom (y)">⛓</button>
      <button id="v-prev" title="Previous (←)">‹</button>
      <span id="v-pos"></span>
      <button id="v-next" title="Next (→)">›</button>
      <button id="v-fit" title="Fit (f / 0)">Fit</button>
      <button id="v-100" title="Actual size (1)">1:1</button>
      <span id="v-zoom"></span>
      <a id="v-raw" target="_blank" title="Open the raw file in a new tab">raw ↗</a>
    </div>
    <div id="panes"></div>
  </section>
</main>
<script src="static/app.js"></script>
</body>
</html>
